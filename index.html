<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Map</title>

    <link rel="stylesheet" href="./bootstrap.css">

    <style>
        body {
            background-color: black;
        }

        .map-image {
            display: block;
            width: 80%;
            height: auto;
            margin: auto;
        }

        @media (max-width: 767px) {
            .map-image {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row align-items-center my-3">

            <div class="col-12">

                <img
                    src="l-intro-1640105927.jpg"
                    usemap="#image-map"
                    class="map-image"
                    alt="Ancient Egyptian image">

                <map name="image-map">

                    <area
                        target="_blank"
                        alt="Offerings"
                        title="Offerings"
                        href="https://raw.githubusercontent.com/mariabahaa619-collab/offerings/refs/heads/main/offerings.jpg"
                        coords="1121,218,1576,872"
                        shape="rect">

                    <area
                        target="_blank"
                        alt="Inscriptions"
                        title="Inscriptions"
                        href="https://raw.githubusercontent.com/mariabahaa619-collab/offerings/refs/heads/main/inscriptions.jpg"
                        coords="0,40,737,896"
                        shape="rect">

                    <area
                        target="_blank"
                        alt="Vertical Inscriptions"
                        title="Vertical Inscriptions"
                        href="https://raw.githubusercontent.com/mariabahaa619-collab/offerings/refs/heads/main/vertical%20ins.jpg"
                        coords="737,47,1577,347"
                        shape="rect">

                    <area
                        target="_blank"
                        alt="Deities"
                        title="Deities"
                        href="https://raw.githubusercontent.com/mariabahaa619-collab/offerings/refs/heads/main/deties.jpg"
                        coords="738,104,1155,896"
                        shape="rect">

                </map>

            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>

    <script>
        window.addEventListener("load", function () {
            imageMapResize();
        });
    </script>

</body>
</html>
